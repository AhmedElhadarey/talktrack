<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23ffc857'/%3E%3Cpath d='M9 7v10l8-5z' fill='%231a1406'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/vendor/hljs/github-dark.min.css">
<link rel="stylesheet" href="/static/player.css">
<script src="/static/vendor/hljs/highlight.min.js"></script>
<script src="/static/vendor/katex/katex.min.js"></script>
<script src="/static/vendor/mermaid.min.js"></script>
</head>
<body data-id="{{ID}}">
<div id="app">
  <div id="viewport">
    <div id="stage">
      <div id="slide-host"></div>
      <div id="pointer" hidden></div>
    </div>
    <div id="waiting" hidden><div class="spinner"></div><span>Writing the next slide…</span></div>
    <div id="overlay">
      <button id="big-play" aria-label="Play">
        <svg viewBox="0 0 24 24" width="44" height="44"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <div id="overlay-title"></div>
      <div id="overlay-sub"></div>
    </div>
    <div id="end" hidden>
      <div class="end-card">
        <h3>Keep learning</h3>
        <div id="followups"></div>
        <div class="end-hint">Click a question to copy it, then ask your agent.</div>
        <button id="replay">Replay</button>
      </div>
    </div>
  </div>
  <div id="caption"></div>
  <div id="controls">
    <button id="prev" title="Previous slide (←)" aria-label="Previous slide"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" fill="currentColor"/></svg></button>
    <button id="play" title="Play / pause (space)" aria-label="Play"><svg viewBox="0 0 24 24" width="22" height="22"><path id="play-icon" d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <button id="next" title="Next slide (→)" aria-label="Next slide"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" fill="currentColor"/></svg></button>
    <div id="time">0:00</div>
    <div id="progress"></div>
    <div id="status"></div>
    <select id="speed" title="Playback speed" aria-label="Playback speed">
      <option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
    </select>
    <button id="cc" title="Captions (c)" aria-label="Toggle captions" class="on">CC</button>
  </div>
</div>
<script src="/static/player.js"></script>
</body>
</html>
