name: Release

# Publishing is a deliberate step: publish a GitHub release for a tag (or run this workflow on
# the tag). Pushing a tag alone publishes nothing, so a tag can pin installs from GitHub first.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to. A published release always goes to PyPI."
        type: choice
        options: [pypi, testpypi]
        default: pypi

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Each index has its own environment, so each carries its own trusted publisher and protection.
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' && 'testpypi' || 'pypi' }}
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing; no API token stored anywhere
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -m "not mlx and not onnx and not browser"
      - name: Check the tag, manifests and changelog agree on the version
        # Fails unless the tag is v<pyproject version>, every manifest carries that version,
        # and CHANGELOG.md has a dated, non-empty section for it.
        run: uv run scripts/sync_version.py --check --tag "$GITHUB_REF_NAME"
      - run: uv build
      - name: Install the wheel outside the repo and play a walkthrough with fake speech
        run: bash scripts/wheel_smoke.sh
      - name: Publish to PyPI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target != 'testpypi' }}
        run: uv publish --trusted-publishing always
      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
        run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
