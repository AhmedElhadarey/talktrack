name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (fake speech, browser, ONNX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -m "not mlx and not onnx and not browser"
      - run: node --test tests/js/
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-screenshots-linux
          path: tests/artifacts/
          if-no-files-found: ignore
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-onnx-${{ hashFiles('src/showntell/speech/onnx_backend.py') }}
      - run: uv run pytest -m onnx

  macos:
    name: macOS Apple silicon (MLX)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not browser and not onnx and not mlx"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mlx-${{ hashFiles('src/showntell/speech/mlx_backend.py') }}
      - name: Download the MLX voice model
        run: uv run python -c "from showntell.speech.mlx_backend import REPO, PATTERNS; from huggingface_hub import snapshot_download; snapshot_download(REPO, allow_patterns=PATTERNS)"
      - run: uv run pytest -m mlx
